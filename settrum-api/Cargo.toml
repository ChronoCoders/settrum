[package]
name = "settrum-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settrum-api"
path = "src/main.rs"

[lib]
name = "settrum_api"
path = "src/lib.rs"

[dependencies]
actix-web = "4"
actix-governor = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
jsonwebtoken = "9"
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"
futures = "0.3"
async-trait = "0.1"
